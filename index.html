<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#030b09">
  <title>TEDU AI & DS · Further. Together.</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage" aria-label="TEDU AI & DS presentation" tabindex="-1">
    <canvas id="ambient" width="1920" height="1080" aria-hidden="true"></canvas>
    <div id="slides"></div>
  </main>
  <nav id="controls" aria-label="Presentation controls">
    <button id="prev" aria-label="Previous slide">←</button>
    <button id="overviewToggle" aria-label="Slide overview"><span id="counter">01 / 10</span></button>
    <button id="next" aria-label="Next slide">→</button>
    <span class="divider"></span>
    <button id="language" aria-label="Change language">TR / <b>EN</b></button>
    <button id="fullscreen" aria-label="Fullscreen">⤢</button>
  </nav>
  <dialog id="overview">
    <div class="dialog-head">
      <h2 data-tr="Slaytlar" data-en="Slides">Slides</h2>
      <button class="close-dialog" data-tr="Kapat ×" data-en="Close ×">Close ×</button>
    </div>
    <div id="overviewGrid"></div>
  </dialog>
  <div id="announcement" class="sr-only" aria-live="polite"></div>
  <noscript>Bu sunumu görüntülemek için JavaScript etkin olmalıdır. / Please enable JavaScript to view this presentation.</noscript>
  <script src="js/deck-visuals.js"></script>
  <script src="js/closing-art.js"></script>
  <script src="js/presentation.js"></script>
</body>
</html>
